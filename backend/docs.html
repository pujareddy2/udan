<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udaan AI — API Explorer & Docs</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #18181b;
      --bg-surface-elevated: #27272a;
      --border: #3f3f46;
      --border-focus: #6366f1;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-alpha: rgba(99, 102, 241, 0.1);
      
      --color-get: #10b981;
      --color-post: #3b82f6;
      --color-delete: #ef4444;
      --color-put: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background-color: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-badge {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    .logo-title {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.025em;
      background: linear-gradient(to right, #ffffff, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .connection-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: blink 1.5s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }

    .sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      background-color: rgba(24, 24, 27, 0.3);
      padding: 1.5rem 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .sidebar-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      padding-left: 0.75rem;
    }

    .endpoint-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .endpoint-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      text-decoration: none;
      color: inherit;
    }

    .endpoint-item:hover {
      background-color: var(--bg-surface);
      border-color: var(--border);
    }

    .endpoint-item.active {
      background-color: var(--accent-alpha);
      border-color: var(--accent);
    }

    .method-tag {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      width: 50px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    .method-get {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--color-get);
    }

    .method-post {
      background-color: rgba(59, 130, 246, 0.1);
      color: var(--color-post);
    }

    .endpoint-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .endpoint-header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .endpoint-route-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .endpoint-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .endpoint-route {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      background-color: var(--bg-base);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      width: fit-content;
      color: #e4e4e7;
    }

    .endpoint-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f4f4f5;
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin-bottom: 1rem;
    }

    .explorer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 1024px) {
      .explorer-grid {
        grid-template-columns: 1fr;
      }
    }

    .params-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea.json-editor {
      width: 100%;
      height: 250px;
      background-color: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #34d399;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 1rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea.json-editor:focus {
      border-color: var(--border-focus);
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: fit-content;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .response-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
    }

    .response-header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-200 {
      background-color: rgba(16, 185, 129, 0.1);
      color: #10b981;
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    .response-body {
      background-color: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow: auto;
      max-height: 400px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #e4e4e7;
      white-space: pre-wrap;
    }

    .schema-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    .schema-table th, .schema-table td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .schema-table th {
      font-weight: 600;
      color: var(--text-muted);
      background-color: rgba(255, 255, 255, 0.02);
    }

    .schema-name {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: #e4e4e7;
    }

    .schema-type {
      font-family: 'JetBrains Mono', monospace;
      color: #f59e0b;
      font-size: 0.8rem;
    }

    .schema-desc {
      color: var(--text-muted);
    }

    .schema-required {
      color: #ef4444;
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <div class="logo-badge">U</div>
      <div class="logo-title">Udaan AI API Explorer</div>
    </div>
    <div class="connection-badge">
      <div class="pulse"></div>
      <span>Backend Online</span>
    </div>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      <div class="sidebar-title">API Endpoints</div>
      <div class="endpoint-list" id="sidebar-endpoints">
        <!-- JS filled -->
      </div>
    </div>
    
    <div class="content-area" id="doc-content">
      <!-- JS filled -->
    </div>
  </div>

  <script>
    const endpoints = [
      {
        id: "ping",
        title: "Ping Endpoint",
        desc: "A health check route to verify that the backend Flask service is running and accessible.",
        method: "GET",
        path: "/api/ping",
        body: null,
        schema: [
          { name: "status", type: "string", desc: "Always returns 'healthy' if backend is running.", req: false },
          { name: "service", type: "string", desc: "Identifier of the service ('udaan-backend').", req: false }
        ]
      },
      {
        id: "profile-parse",
        title: "Parse Profile",
        desc: "Extracts a structured jobseeker or senior citizen profile from unstructured speech transcripts or free-text inputs. Utilizes the Groq Llama-3.3 LLM integrations internally.",
        method: "POST",
        path: "/api/profile/parse",
        body: {
          text: "My name is Sree. I am 25 years old OBC female from Telangana. I completed my graduate degree. I know a bit of Excel, but I do not know typing or quantitative aptitude.",
          module: "jobseeker",
          lang: "en"
        },
        schema: [
          { name: "text", type: "string", desc: "Unstructured profile description or voice transcript.", req: true },
          { name: "module", type: "string", desc: "'jobseeker' or 'senior_citizen'", req: false },
          { name: "lang", type: "string", desc: "Language code: 'en' (English), 'te' (Telugu), or 'hi' (Hindi).", req: false }
        ]
      },
      {
        id: "profile-form",
        title: "Form Profile Validation",
        desc: "Takes values directly from a manual user form, processes list inputs (skills, documents, interests) and integer fields (age, income), then validates and returns a clean, structured profile.",
        method: "POST",
        path: "/api/profile/form",
        body: {
          form: {
            name: "Sree",
            age: 25,
            gender: "female",
            category: "obc",
            state: "Telangana",
            qualification: "graduate",
            income: 180000,
            skills: ["excel"],
            interests: ["reading"],
            documents: ["12th_marksheet", "aadhaar", "caste_certificate", "dob_proof"]
          },
          module: "jobseeker"
        },
        schema: [
          { name: "form", type: "object", desc: "The dictionary containing user form inputs.", req: true },
          { name: "module", type: "string", desc: "'jobseeker' or 'senior_citizen'", req: true }
        ]
      },
      {
        id: "opportunities-match",
        title: "Match Opportunities",
        desc: "Applies the core eligibility engine, missed opportunities (regret) tracker, active alerts system, and upgrade recommendations for training schemes matching missing skills.",
        method: "POST",
        path: "/api/opportunities/match",
        body: {
          profile: {
            name: "Sree",
            age: 25,
            gender: "female",
            category: "obc",
            state: "Telangana",
            qualification: "graduate",
            income: 180000,
            skills: ["excel", "typing", "computer_basics", "data_entry"],
            interests: ["reading"],
            documents: ["12th_marksheet", "aadhaar", "caste_certificate", "dob_proof"],
            module: "jobseeker"
          },
          lang: "te"
        },
        schema: [
          { name: "profile", type: "object", desc: "A fully structured profile dictionary (returned from parse or form endpoints).", req: true },
          { name: "lang", type: "string", desc: "Target translation language code ('en', 'te', 'hi').", req: false }
        ]
      },
      {
        id: "scam-check",
        title: "Scam Shield Heuristics",
        desc: "Uses rule-based heuristics on job descriptions to identify potential scams, flagging high-risk phrases, upfront payment demands, and suspicious contact emails.",
        method: "POST",
        path: "/api/scam/check",
        body: {
          text: "Earn 50000 rupees per day working from home. No experience needed! Just transfer an registration fee of 1500 to our scanner to start."
        },
        schema: [
          { name: "text", type: "string", desc: "The opportunity description text to check.", req: true }
        ]
      }
    ];

    let currentActiveId = "ping";

    function initSidebar() {
      const sidebarEl = document.getElementById("sidebar-endpoints");
      sidebarEl.innerHTML = "";
      endpoints.forEach(ep => {
        const item = document.createElement("div");
        item.className = `endpoint-item ${ep.id === currentActiveId ? 'active' : ''}`;
        item.onclick = () => selectEndpoint(ep.id);
        
        const methodTag = document.createElement("span");
        methodTag.className = `method-tag method-${ep.method.toLowerCase()}`;
        methodTag.textContent = ep.method;
        
        const pathSpan = document.createElement("span");
        pathSpan.className = "endpoint-path";
        pathSpan.textContent = ep.path;
        
        item.appendChild(methodTag);
        item.appendChild(pathSpan);
        sidebarEl.appendChild(item);
      });
    }

    function selectEndpoint(id) {
      currentActiveId = id;
      initSidebar();
      renderContent();
    }

    async function sendRequest(ep) {
      const btn = document.getElementById("send-btn");
      const statusText = document.getElementById("res-status");
      const statusBadge = document.getElementById("res-status-badge");
      const responseTime = document.getElementById("res-time");
      const responseBody = document.getElementById("res-body");
      
      btn.disabled = true;
      btn.textContent = "Sending...";
      responseBody.textContent = "Waiting for response...";
      statusBadge.style.display = "none";
      
      const startTime = performance.now();
      const bodyEditor = document.getElementById("body-editor");
      
      let options = {
        method: ep.method,
        headers: {
          'Content-Type': 'application/json'
        }
      };

      if (ep.method === "POST" && bodyEditor) {
        options.body = bodyEditor.value;
      }

      try {
        const res = await fetch(`http://localhost:5000${ep.path}`, options);
        const duration = Math.round(performance.now() - startTime);
        
        responseTime.textContent = `Time: ${duration} ms`;
        statusBadge.style.display = "inline-block";
        statusBadge.textContent = res.status;
        
        if (res.ok) {
          statusBadge.className = "status-badge status-200";
        } else {
          statusBadge.className = "status-badge status-error";
        }
        
        const json = await res.json();
        responseBody.textContent = JSON.stringify(json, null, 2);
      } catch (err) {
        const duration = Math.round(performance.now() - startTime);
        responseTime.textContent = `Time: ${duration} ms`;
        statusBadge.style.display = "inline-block";
        statusBadge.textContent = "Error";
        statusBadge.className = "status-badge status-error";
        responseBody.textContent = `Fetch error: Failed to connect to server.\n\nIs the Flask server running?`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z"/></svg> Send Request`;
      }
    }

    function renderContent() {
      const ep = endpoints.find(e => e.id === currentActiveId);
      const contentEl = document.getElementById("doc-content");
      
      let bodyEditorHTML = "";
      if (ep.method === "POST") {
        bodyEditorHTML = `
          <div>
            <div class="section-title">Request Body (JSON)</div>
            <textarea id="body-editor" class="json-editor">${JSON.stringify(ep.body, null, 2)}</textarea>
          </div>
        `;
      }

      let schemaRows = ep.schema.map(s => `
        <tr>
          <td class="schema-name">${s.name} ${s.req ? '<span class="schema-required">*</span>' : ''}</td>
          <td class="schema-type">${s.type}</td>
          <td class="schema-desc">${s.desc}</td>
        </tr>
      `).join("");

      contentEl.innerHTML = `
        <div class="panel">
          <div class="endpoint-header">
            <div class="endpoint-route-container">
              <span class="method-tag method-${ep.method.toLowerCase()}">${ep.method}</span>
              <span class="endpoint-route">${ep.path}</span>
            </div>
            <h1 class="endpoint-title">${ep.title}</h1>
            <p class="endpoint-desc">${ep.desc}</p>
          </div>
          
          <div>
            <div class="section-title">Parameters & Fields Schema</div>
            <table class="schema-table">
              <thead>
                <tr>
                  <th>Field</th>
                  <th>Type</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody>
                ${schemaRows}
              </tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <h2 style="font-size: 1.25rem; font-weight: 700;">Interactive API Playground</h2>
          <div class="explorer-grid">
            <div class="params-container">
              ${bodyEditorHTML}
              <button id="send-btn" class="btn" onclick='triggerRequest()'>
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z"/>
                </svg>
                Send Request
              </button>
            </div>
            
            <div class="response-container">
              <div class="response-header-info">
                <span>Response</span>
                <div>
                  <span id="res-status-badge" class="status-badge" style="display: none;"></span>
                  <span id="res-time" style="margin-left: 10px;"></span>
                </div>
              </div>
              <pre id="res-body" class="response-body">Click "Send Request" to test endpoint live.</pre>
            </div>
          </div>
        </div>
      `;
    }

    function triggerRequest() {
      const ep = endpoints.find(e => e.id === currentActiveId);
      sendRequest(ep);
    }

    // Initialize UI
    initSidebar();
    renderContent();
  </script>
</body>
</html>
